name: Rust Job Radar - CI

on:
  push:
    branches: [master]
    paths:
      - "rust-job-radar/**"
      - ".github/workflows/rust-job-radar-ci.yml"
  pull_request:
    paths:
      - "rust-job-radar/**"
      - ".github/workflows/rust-job-radar-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-job-radar
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --all-targets
