name: Rust Job Radar - Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "31 9 * * *"
      timezone: "Europe/Istanbul"

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-job-radar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore 30-day job cache
        uses: actions/cache/restore@v4
        with:
          path: rust-job-radar/data/job_cache.json
          key: rust-job-radar-job-cache-${{ github.run_id }}
          restore-keys: |
            rust-job-radar-job-cache-

      - name: Prepare report directory
        run: mkdir -p data

      - name: Run radar and send email
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_USERNAME: aliihaydargenc@gmail.com
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: smtp.gmail.com
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: cargo run --release

      - name: Upload daily report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-job-radar-report
          path: rust-job-radar/data/latest_report.html
          if-no-files-found: warn
          retention-days: 14

      - name: Save 30-day job cache
        if: ${{ always() && hashFiles('rust-job-radar/data/job_cache.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: rust-job-radar/data/job_cache.json
          key: rust-job-radar-job-cache-${{ github.run_id }}